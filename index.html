<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>回家的灯 · 九重春</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="stylesheet" href="css/style.css?v=32" />
  </head>
  <body>
    <div id="app">
      <div id="stage" class="scene-home" aria-live="polite">
        <div class="sky-layer" aria-hidden="true"></div>
        <div class="city-silhouette" aria-hidden="true"></div>
        <div class="light-wash" aria-hidden="true"></div>
        <div class="home-glow" aria-hidden="true"></div>

        <div id="sprite" class="sprite hidden" aria-hidden="true">
          <img
            id="sprite-img"
            class="sprite-img"
            src="assets/sprites/haru_neutral.png"
            alt="九重春"
            draggable="false"
          />
        </div>

        <section id="title-screen" class="overlay-screen">
          <div class="title-copy">
            <p class="title-series">对话与相处 · 第一幕可玩</p>
            <h1 class="title-brand">回家的灯</h1>
            <p class="title-tagline">
              九重春，27岁。冷脸，娇小，社畜。<br />
              家的温度与恋爱并行——前者不会被后者替代。
            </p>
            <div class="title-actions">
              <button type="button" id="btn-start" class="btn primary">开始游戏</button>
              <button type="button" id="btn-continue" class="btn ghost hidden">继续</button>
              <button type="button" id="btn-title-load" class="btn ghost hidden">读档</button>
            </div>
            <div class="test-nodes" aria-label="剧情测试节点">
              <p class="test-nodes-label">剧情节点（测试用）</p>
              <div id="test-node-list" class="test-node-list"></div>
            </div>
            <p class="title-hint">建议使用电脑浏览器游玩 · 暂不适配手机</p>
          </div>
        </section>

        <div id="pc-only-notice" class="pc-only-notice" aria-hidden="true">
          <p>本游戏目前仅适配电脑浏览器。</p>
          <p class="pc-only-sub">请用电脑打开同一链接游玩，效果更稳定。</p>
        </div>

        <div id="game-ui" class="hidden">
          <div class="top-bar">
            <div class="status-cluster">
              <span id="chapter-pill" class="affection">初遇</span>
              <span id="time-pill" class="affection soft">—</span>
              <span id="intimacy-pill" class="affection">亲密 0 · 相识</span>
              <span id="safety-pill" class="affection soft">安心 35</span>
            </div>
            <div class="top-actions">
              <button type="button" id="btn-log" class="btn tiny ghost">回顾</button>
              <button type="button" id="btn-menu" class="btn tiny ghost">菜单</button>
            </div>
          </div>

          <div id="dialogue-box" class="dialogue-box">
            <div id="speaker" class="speaker"></div>
            <p id="dialogue-text" class="dialogue-text"></p>
            <span id="click-hint" class="click-hint" aria-hidden="true">▼</span>
          </div>

          <div id="choices" class="choices hidden" role="group" aria-label="选项"></div>
        </div>

        <section id="ending-screen" class="overlay-screen hidden">
          <div class="ending-card">
            <p class="ending-label">END</p>
            <h2 id="ending-title" class="ending-title"></h2>
            <p id="ending-text" class="ending-text"></p>
            <div class="title-actions">
              <button type="button" id="btn-restart" class="btn primary">再玩一次</button>
              <button type="button" id="btn-title" class="btn ghost">返回标题</button>
            </div>
          </div>
        </section>

        <section id="menu-screen" class="overlay-screen dim hidden">
          <div class="menu-panel">
            <h3>菜单</h3>
            <p class="menu-hint">共 5 个存档槽。可随时保存；推进时另有自动备份。关闭后用「继续」或「读档」。</p>
            <button type="button" id="btn-save" class="btn block">保存进度</button>
            <button type="button" id="btn-load" class="btn block">读取进度</button>
            <button type="button" id="btn-to-title" class="btn block ghost">返回标题</button>
            <button type="button" id="btn-close-menu" class="btn block ghost">关闭</button>
            <p id="menu-toast" class="menu-toast" aria-live="polite"></p>
          </div>
        </section>

        <section id="save-screen" class="overlay-screen dim hidden">
          <div class="save-panel">
            <div class="save-header">
              <h3 id="save-panel-title">保存进度</h3>
              <button type="button" id="btn-close-save" class="btn tiny ghost">关闭</button>
            </div>
            <p id="save-panel-hint" class="save-hint"></p>
            <div id="save-slot-list" class="save-slot-list" role="list"></div>
            <p id="save-toast" class="menu-toast" aria-live="polite"></p>
          </div>
        </section>

        <section id="log-screen" class="overlay-screen dim hidden">
          <div class="log-panel">
            <div class="log-header">
              <h3>文本回顾</h3>
              <button type="button" id="btn-close-log" class="btn tiny ghost">关闭</button>
            </div>
            <div id="log-list" class="log-list"></div>
          </div>
        </section>

        <section id="name-screen" class="overlay-screen dim hidden">
          <div class="name-panel">
            <h3>自我介绍</h3>
            <p class="name-hint">输入你的姓或昵称。她会以此称呼你（例如输入「尘」，她会叫你「尘先生」）。</p>
            <label class="name-label" for="name-input">你的称呼</label>
            <input
              id="name-input"
              class="name-input"
              type="text"
              maxlength="8"
              placeholder="例如：尘"
              autocomplete="off"
              spellcheck="false"
            />
            <p id="name-error" class="name-error" aria-live="polite"></p>
            <button type="button" id="btn-confirm-name" class="btn primary block">确定</button>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="js/main.js?v=32"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" />
<title>三张精修候选</title>
<style>
body{margin:0;padding:24px;font-family:"Segoe UI","PingFang SC",sans-serif;background:#1a1f28;color:#f3ebe0}
h1{font-weight:500} .hint{opacity:.75;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:14px;max-width:640px}
.grid4{grid-template-columns:repeat(4,minmax(140px,1fr));max-width:900px}
figure{margin:0;background:#2a3140;border-radius:10px;overflow:hidden;border:1px solid rgba(243,235,224,.12)}
img{display:block;width:100%;background:#fff} figcaption{padding:8px 10px;font-size:.85rem}
section{margin-bottom:32px} h2{font-size:1.05rem;font-weight:500}
</style></head><body>
<h1>三张精修 · 候选</h1>
<p class="hint">回编号锁定，例如 cup-3、smile-1、towel-2。立绘可跨情节复用，不必每场新图。</p>
<section>
  <h2>捧杯 · 冷脸里的一点温度</h2>
  <div class="grid grid4">
    <figure><img src="haru_cup_1.png" /><figcaption>cup-1</figcaption></figure>
    <figure><img src="haru_cup_2.png" /><figcaption>cup-2</figcaption></figure>
    <figure><img src="haru_cup_3.png" /><figcaption>cup-3</figcaption></figure>
    <figure><img src="haru_cup_4.png" /><figcaption>cup-4</figcaption></figure>
    <figure><img src="haru_cup_5.png" /><figcaption>cup-5</figcaption></figure>
    <figure><img src="haru_cup_6.png" /><figcaption>cup-6</figcaption></figure>
  </div>
</section>
<section>
  <h2>极淡的笑 · 对视（可复用）</h2>
  <div class="grid">
    <figure><img src="haru_smile_1.png" /><figcaption>smile-1</figcaption></figure>
    <figure><img src="haru_smile_2.png" /><figcaption>smile-2</figcaption></figure>
  </div>
</section>
<section>
  <h2>浴后毛巾 · 卸下防备</h2>
  <div class="grid">
    <figure><img src="haru_towel_1.png" /><figcaption>towel-1</figcaption></figure>
    <figure><img src="haru_towel_2.png" /><figcaption>towel-2</figcaption></figure>
  </div>
</section>
</body></html>
